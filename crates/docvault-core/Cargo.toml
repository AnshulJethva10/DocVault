[package]
name = "docvault-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]

# ─── Feature flags ────────────────────────────────────────────────────────────
# "wasm":      enables wasm-bindgen exports for the browser build
#              (wasm-pack build --target web --out-dir pkg -- --features wasm)
# No features: plain Rust library for native use (docvault-cli). This must stay
#              the default: Cargo unifies features across the workspace, so a
#              default "wasm" would leak into the CLI build and break it.
[features]
default = []
wasm = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:console_error_panic_hook",
    "dep:serde-wasm-bindgen",
    "getrandom/js",
    "ring/wasm32_unknown_unknown_js",
]

[dependencies]
# WASM-only deps — gated behind the "wasm" feature
wasm-bindgen          = { version = "0.2", optional = true }
js-sys                = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde-wasm-bindgen    = { version = "0.6", optional = true }

# Always-on deps
ring      = { version = "0.17" }
serde     = { version = "1", features = ["derive"] }
getrandom = { version = "0.2" }   # js feature added by "wasm" flag above

